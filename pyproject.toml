[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voymap"
dynamic = ["version"]
description = "Build offline MBTiles maps (and GPX) for the Trail Tech Voyager Pro from public tile sources"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "Pillow>=10",
  "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/GnomeTek/VoyagerMapper"
Issues = "https://github.com/GnomeTek/VoyagerMapper/issues"

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest"]
build = ["pyinstaller>=6.10"]

[tool.setuptools.dynamic]
version = { attr = "voymap.__version__" }

[project.scripts]
voymap = "voymap.cli:main"
voymap-gui = "voymap.gui.app:main"

[tool.setuptools.packages.find]
include = ["voymap*"]

[tool.setuptools.package-data]
"voymap.gui" = ["web/*.html", "web/vendor/*", "web/vendor/images/*"]
