[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voymap"
version = "0.1.0"
description = "Build offline MBTiles maps (and GPX) for the Trail Tech Voyager Pro from public tile sources"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "Pillow>=10",
  "requests>=2.31",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest"]

[project.scripts]
voymap = "voymap.cli:main"
voymap-gui = "voymap.gui.app:main"

[tool.setuptools.packages.find]
include = ["voymap*"]

[tool.setuptools.package-data]
"voymap.gui" = ["web/*.html", "web/vendor/*", "web/vendor/images/*"]
