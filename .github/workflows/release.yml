name: release

# Push a tag like v0.1.0 to build the Windows installer and attach it to a GitHub Release.
# The tag must match voymap.__version__ (the job checks).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[gui,dev,build]"

      - name: Version
        id: ver
        shell: bash
        run: |
          VER=$(python -c "import voymap;print(voymap.__version__)")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VER" ]]; then
            echo "tag $GITHUB_REF_NAME does not match voymap.__version__ = $VER" >&2; exit 1
          fi

      - name: Tests
        run: python -m pytest -q

      - name: PyInstaller
        run: pyinstaller packaging/voymap.spec --noconfirm

      - name: Smoke test the frozen build
        shell: bash
        run: |
          ./dist/voymap/voymap-cli.exe sources
          ./dist/voymap/voymap-cli.exe estimate --bbox -111.8 35.1 -111.5 35.35 --zooms 8-12
          ls dist/voymap/_internal/PySide6 | grep -i webengine

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} packaging\voymap.iss

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\voymap\* -DestinationPath dist\voymap-portable-${{ steps.ver.outputs.version }}-win64.zip

      - name: Checksums
        shell: bash
        run: cd dist && sha256sum voymap-setup-*.exe voymap-portable-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: voymap-windows-${{ steps.ver.outputs.version }}
          path: |
            dist/voymap-setup-*.exe
            dist/voymap-portable-*.zip
            dist/SHA256SUMS.txt

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/voymap-setup-*.exe
            dist/voymap-portable-*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
